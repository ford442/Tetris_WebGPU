name: GPU tests (software adapter)

# WGSL compile gate + compute-kernel parity + browser E2E / visual regression.
# No GPU hardware: Dawn Node on lavapipe for the Vitest layers, Chromium on SwiftShader for E2E.
# See docs/gpu-testing.md.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/webgpu/**'
      - 'src/viewWebGL2/**'
      - 'src/viewCpp/**'
      - 'src/view/**'
      - 'src/deterministic.ts'
      - 'src/replay/**'
      - 'index.ts'
      - 'cpp/**'
      - 'public/cpp/**'
      - 'shared/**'
      - 'public/block-material.json'
      - 'scripts/validate-wgsl.ts'
      - 'scripts/generate-cpp-*.mjs'
      - 'tests/**'
      - 'playwright.config.ts'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/gpu-tests.yml'
  pull_request:
    paths:
      - 'src/webgpu/**'
      - 'src/viewWebGL2/**'
      - 'src/viewCpp/**'
      - 'src/view/**'
      - 'src/deterministic.ts'
      - 'src/replay/**'
      - 'index.ts'
      - 'cpp/**'
      - 'public/cpp/**'
      - 'shared/**'
      - 'public/block-material.json'
      - 'scripts/validate-wgsl.ts'
      - 'scripts/generate-cpp-*.mjs'
      - 'tests/**'
      - 'playwright.config.ts'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/gpu-tests.yml'

concurrency:
  group: gpu-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  wgsl-and-chores:
    name: WGSL compile + chore kernel parity
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - run: npm ci

      # lavapipe: Mesa's CPU Vulkan driver. Dawn Node finds it through the Vulkan loader.
      - name: Install software Vulkan
        run: |
          sudo apt-get update
          sudo apt-get install -y mesa-vulkan-drivers libvulkan1

      # TETRIS_REQUIRE_GPU=1 turns "no adapter" from a skip into a failure, so this job can never
      # go green by not running anything.
      - name: Compile every WGSL module (file:line on error)
        env:
          TETRIS_REQUIRE_GPU: "1"
        run: npm run wgsl:validate

      - name: Kernel parity + compile tests
        env:
          TETRIS_REQUIRE_GPU: "1"
        run: npm run test:gpu

  e2e:
    name: Browser E2E + visual regression
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - run: npm ci

      # The browser revision is pinned by the exact @playwright/test version in package.json;
      # goldens are pixels from that revision's SwiftShader.
      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Build (production bundle, as shipped)
        run: npm run build

      - name: Run E2E
        run: npm run e2e

      - name: Upload diffs and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results
          if-no-files-found: ignore
          retention-days: 14
          path: |
            test-results/
            playwright-report/
