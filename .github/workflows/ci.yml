name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref to save minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        node-version: ["20", "22"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build release WASM
        run: npm run asbuild:release

      # Pure Node, no emsdk: the committed public/cpp artifact must be the release build
      # of the pinned emcc (.emsdk-version) from the current cpp/shared sources.
      # The byte-level rebuild-and-diff lives in cpp-renderer.yml.
      - name: Verify committed C++ renderer artifact
        run: npm run cpp:verify

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # lavapipe + TETRIS_REQUIRE_GPU=1: the WGSL compile and chore-kernel parity suites run on a
      # software WebGPU adapter as part of `npm test`, and a missing adapter fails instead of skipping.
      - name: Install software Vulkan (lavapipe)
        run: |
          sudo apt-get update
          sudo apt-get install -y mesa-vulkan-drivers libvulkan1

      - name: Run tests
        env:
          TETRIS_REQUIRE_GPU: "1"
        run: npm test

      - name: Build production bundle
        run: npm run build
